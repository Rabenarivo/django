<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
</head>
<body>
    <h1>Connexion</h1>

    {% if form.errors %}
        <p style="color:red;">Identifiants invalides, réessayez.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div>
            <label for="id_username">Nom d'utilisateur</label>
            {{ form.username }}
        </div>
        <div>
            <label for="id_password">Mot de passe</label>
            {{ form.password }}
        </div>
        <button type="submit">Se connecter</button>
    </form>

    <p><a href="{% url 'logout' %}">Déconnexion</a></p>
</body>
</html>
