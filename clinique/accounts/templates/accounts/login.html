{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Clinique</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/accounts/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7 col-sm-9">
                    <div class="card login-card">
                        <div class="card-header text-center">
                            <h2 class="mb-0">
                                <i class="bi bi-hospital me-2"></i>
                                Clinique Management
                            </h2>
                            <p class="mb-0 mt-2 opacity-75">Veuillez vous connecter</p>
                        </div>
                        <div class="card-body">
                            {% if form.errors %}
                                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                    <strong>Erreur !</strong> Identifiants invalides, réessayez.
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endif %}
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-4">
                                    <label for="id_username" class="form-label fw-semibold text-primary-clinique">
                                        Nom d'utilisateur
                                    </label>
                                    <input type="text" name="username" id="id_username"
                                           class="form-control form-control-lg" required autofocus>
                                </div>
                                <div class="mb-4">
                                    <label for="id_password" class="form-label fw-semibold text-primary-clinique">
                                        Mot de passe
                                    </label>
                                    <input type="password" name="password" id="id_password"
                                           class="form-control form-control-lg" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        Se connecter
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
