{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil Réceptionniste</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/accounts/receptionniste.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-hospital me-2"></i>
                Clinique Management
            </a>
            <div class="ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button"
                            id="userDropdown" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        {{ user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="home-container">
        <div class="container">
            <h1 class="mb-5 text-primary-clinique">
                <i class="bi bi-door-open me-2"></i>
                Bienvenue Réceptionniste {{ user.username }}!
            </h1>

            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-primary-clinique mb-3">
                                <i class="bi bi-clock"></i>
                            </div>
                            <h3 class="fw-bold text-primary-clinique">0</h3>
                            <p class="text-muted mb-0">En attente</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-primary mb-3">
                                <i class="bi bi-calendar-check"></i>
                            </div>
                            <h3 class="fw-bold text-primary">0</h3>
                            <p class="text-muted mb-0">Confirmés</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-secondary-clinique mb-3">
                                <i class="bi bi-calendar-x"></i>
                            </div>
                            <h3 class="fw-bold text-secondary-clinique">0</h3>
                            <p class="text-muted mb-0">Annulés</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card section-card">
                <div class="card-header">
                    <h5 class="mb-0">Actions rapides</h5>
                </div>
                <div class="card-body p-4">
                    <div class="d-grid gap-3">
                        <a href="{% url 'list_consultation' %}" class="btn btn-primary">
                            <i class="bi bi-calendar3 me-2"></i>
                            Voir tous les rendez-vous
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
