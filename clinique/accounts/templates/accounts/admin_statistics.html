{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques Administrateur | Clinique</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            padding-bottom: 2rem;
        }

        .navbar {
            background-color: #2c3e50;
        }

        .navbar-brand, .navbar .nav-link, .navbar .dropdown-toggle {
            color: #ecf0f1 !important;
        }

        .page-header {
            margin-top: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            height: 100%;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 1.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <i class="bi bi-hospital me-2"></i>
                Clinique Management
            </a>
            <div class="ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        {{ user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2 class="mb-0 text-primary">
                <i class="bi bi-bar-chart-line me-2"></i>Statistiques Globales
            </h2>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Retour au tableau de bord
            </a>
        </div>

        <div class="row">
            <!-- Top 5 Medicines -->
            <div class="col-lg-6 mb-4">
                <div class="chart-card">
                    <h3 class="chart-title"><i class="bi bi-pie-chart text-info me-2"></i>Top 5 des Médicaments Vendus</h3>
                    <div class="chart-container">
                        <canvas id="topMedicinesChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Nouveaux Patients par mois -->
            <div class="col-lg-6 mb-4">
                <div class="chart-card">
                    <h3 class="chart-title"><i class="bi bi-people text-success me-2"></i>Nouveaux Patients (par mois)</h3>
                    <div class="chart-container">
                        <canvas id="patientsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Chiffre d'affaires par mois -->
            <div class="col-12 mb-4">
                <div class="chart-card">
                    <h3 class="chart-title"><i class="bi bi-graph-up-arrow text-primary me-2"></i>Chiffre d'Affaires (par mois)</h3>
                    <div class="chart-container" style="height: 400px;">
                        <canvas id="caChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart Configuration -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Data passed from Django View
            const topMedicinesData = {{ top_medicines|safe }};
            const caByMonthData = {{ ca_by_month|safe }};
            const patientsByMonthData = {{ patients_by_month|safe }};

            // Common Chart.js Options
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#7f8c8d';

            // 1. Top Medicines Chart (Doughnut)
            if (topMedicinesData.length > 0) {
                const medLabels = topMedicinesData.map(item => item.name);
                const medValues = topMedicinesData.map(item => item.qty);
                
                new Chart(document.getElementById('topMedicinesChart'), {
                    type: 'doughnut',
                    data: {
                        labels: medLabels,
                        datasets: [{
                            data: medValues,
                            backgroundColor: [
                                '#3498db', '#2ecc71', '#f1c40f', '#e74c3c', '#9b59b6'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right'
                            }
                        }
                    }
                });
            } else {
                document.getElementById('topMedicinesChart').parentElement.innerHTML = '<p class="text-center text-muted mt-5">Aucune donnée disponible</p>';
            }

            // 2. Patients Chart (Line)
            if (patientsByMonthData.length > 0) {
                const patLabels = patientsByMonthData.map(item => item.month);
                const patValues = patientsByMonthData.map(item => item.total);

                new Chart(document.getElementById('patientsChart'), {
                    type: 'line',
                    data: {
                        labels: patLabels,
                        datasets: [{
                            label: 'Nouveaux Patients',
                            data: patValues,
                            borderColor: '#2ecc71',
                            backgroundColor: 'rgba(46, 204, 113, 0.2)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { stepSize: 1 }
                            }
                        }
                    }
                });
            } else {
                document.getElementById('patientsChart').parentElement.innerHTML = '<p class="text-center text-muted mt-5">Aucune donnée disponible</p>';
            }

            // 3. Chiffre d'Affaires Chart (Bar)
            if (caByMonthData.length > 0) {
                const caLabels = caByMonthData.map(item => item.month);
                const caValues = caByMonthData.map(item => item.total);

                new Chart(document.getElementById('caChart'), {
                    type: 'bar',
                    data: {
                        labels: caLabels,
                        datasets: [{
                            label: 'Chiffre d\'Affaires (€)',
                            data: caValues,
                            backgroundColor: '#3498db',
                            borderRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } else {
                document.getElementById('caChart').parentElement.innerHTML = '<p class="text-center text-muted mt-5">Aucune donnée disponible</p>';
            }
        });
    </script>
</body>
</html>
