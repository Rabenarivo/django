{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil Docteur - Clinique</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/accounts/home_doctor.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-hospital me-2"></i>
                Clinique Management
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>
                            Dr {{ user.username }}
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                            </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="home-container">
        <div class="container">
            <h1 class="mb-5 text-primary-clinique">
                <i class="bi bi-heart-pulse me-2"></i>
                Tableau de bord - Docteur
            </h1>

            <!-- Stats Cards -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-primary-clinique mb-3">
                                <i class="bi bi-calendar2-check"></i>
                            </div>
                            <h3 class="fw-bold text-primary-clinique">0</h3>
                            <p class="text-muted mb-0">Rendez-vous aujourd'hui</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-primary mb-3">
                                <i class="bi bi-file-earmark-medical"></i>
                            </div>
                            <h3 class="fw-bold text-primary">0</h3>
                            <p class="text-muted mb-0">Consultations</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card">
                        <div class="card-body text-center p-4">
                            <div class="stats-icon text-secondary-clinique mb-3">
                                <i class="bi bi-prescription2"></i>
                            </div>
                            <h3 class="fw-bold text-secondary-clinique">0</h3>
                            <p class="text-muted mb-0">Prescriptions</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card section-card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-list-task me-2"></i>
                                Actions rapides
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a href="{% url 'list_consultation_doctor' %}" class="btn btn-outline-primary">
                                    <i class="bi bi-calendar3 me-2"></i>
                                    Voir mes rendez-vous
                                </a>
                                <a href="{% url 'list_prescriptions_doctor' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-prescription me-2"></i>
                                    Voir mes prescriptions
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Calendar Section -->
                <div class="col-lg-6">
                    <div class="card section-card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-calendar-event me-2"></i>
                                Mon Agenda (Rendez-vous Confirmés)
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="calendar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <!-- FullCalendar locale FR -->
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/fr.global.min.js'></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var eventsData = {{ events_json|safe }};

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridDay', // Vue par jour avec les heures
                locale: 'fr',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: "Aujourd'hui",
                    month: 'Mois',
                    week: 'Semaine',
                    day: 'Jour',
                    list: 'Liste'
                },
                slotMinTime: '07:00:00', // Heure de début d'affichage
                slotMaxTime: '22:00:00', // Étendu pour voir les rdv du soir (ex: 20h30)
                allDaySlot: false,
                events: eventsData,
                eventClick: function(info) {
                    if (info.event.url) {
                        window.location.href = info.event.url;
                        info.jsEvent.preventDefault(); // prevents browser from following link in current tab.
                    }
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
