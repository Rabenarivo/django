{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrivage Stock | Clinique</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        .page-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            padding: 0.75rem 1rem;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-control:focus, .form-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        .btn-submit {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #2980b9 0%, #2471a3 100%);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
            transform: translateY(-2px);
            color: white;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: #34495e;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="glass-card">
            <a href="{% url 'home' %}" class="back-link"><i class="bi bi-arrow-left me-2"></i>Retour à l'accueil</a>
            <h2 class="page-title"><i class="bi bi-box-seam me-2 text-primary" style="color: #3498db;"></i>Nouvel Arrivage</h2>
            <p class="page-subtitle">Déclarez un nouveau lot de stock pour un médicament.</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="{{ form.medicine.id_for_label }}" class="form-label">Médicament ciblé</label>
                    {{ form.medicine }}
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.numero_lot.id_for_label }}" class="form-label">Numéro de lot</label>
                        {{ form.numero_lot }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.quantity_in_stock.id_for_label }}" class="form-label">Quantité (boîtes)</label>
                        {{ form.quantity_in_stock }}
                    </div>
                </div>

                <div class="mb-4">
                    <label for="{{ form.expiration_date.id_for_label }}" class="form-label">Date de péremption</label>
                    <!-- Type date to show a nice calendar picker -->
                    <input type="date" name="{{ form.expiration_date.name }}" id="{{ form.expiration_date.id_for_label }}" class="form-control" {% if form.expiration_date.value %}value="{{ form.expiration_date.value }}"{% endif %}>
                </div>

                <button type="submit" class="btn btn-submit">
                    <i class="bi bi-check2-circle me-2"></i>Valider l'arrivage en stock
                </button>
            </form>
        </div>
    </div>
    
    <!-- Apply Bootstrap classes to the form fields automatically -->
    <script>
        document.querySelectorAll('input[type="text"], input[type="number"], select, textarea').forEach(function(el) {
            // Do not override our custom date picker input class
            if(el.type !== 'date') {
                if(el.tagName.toLowerCase() === 'select') {
                    el.classList.add('form-select');
                } else {
                    el.classList.add('form-control');
                }
            }
        });
    </script>
</body>
</html>
