<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrivage de Stock</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>Déclarer un Arrivage (Stock de Médicament)</h2>
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.medicine.id_for_label }}">Médicament (Menu déroulant) :</label>
            {{ form.medicine }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.numero_lot.id_for_label }}">Numéro de lot :</label>
            {{ form.numero_lot }}
        </div>

        <div class="form-group">
            <label for="{{ form.quantity_in_stock.id_for_label }}">Quantité reçue (Nombre de boîtes) :</label>
            {{ form.quantity_in_stock }}
        </div>

        <div class="form-group">
            <label for="{{ form.expiration_date.id_for_label }}">Date de péremption (ex: YYYY-MM-DD) :</label>
            {{ form.expiration_date }}
        </div>

        <button type="submit">Valider l'arrivage</button>
    </form>
</body>
</html>
