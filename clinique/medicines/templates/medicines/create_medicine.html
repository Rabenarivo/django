<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Médicament</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h2>Ajouter un nouveau Médicament au Catalogue</h2>
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.name.id_for_label }}">Nom du médicament :</label>
            {{ form.name }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.type.id_for_label }}">Type de médicament (Menu déroulant) :</label>
            {{ form.type }}
        </div>

        <div class="form-group">
            <label for="{{ form.stock_min.id_for_label }}">Seuil d'alerte (Stock min) :</label>
            {{ form.stock_min }}
        </div>

        <div class="form-group">
            <label for="{{ form.price.id_for_label }}">Prix :</label>
            {{ form.price }}
        </div>

        <div class="form-group">
            <label for="{{ form.description.id_for_label }}">Description :</label>
            {{ form.description }}
        </div>

        <button type="submit">Enregistrer et passer au stock</button>
    </form>
</body>
</html>
